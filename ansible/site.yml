---
# Two-node Flash-Next endpoint + login-node services + agent workbench. Run as the SERVICE ACCOUNT on the login node:
#   ansible-playbook -i localhost, -c local site.yml               (fast steps)
#   ansible-playbook -i localhost, -c local site.yml --tags build  (also the engine-node builds; ~1 h first time)
# No root. Prerequisites and what is deliberately NOT done here: ansible/README.md and ADMIN.md.

- name: Inference endpoint stack (service account, no root)
  hosts: all
  gather_facts: false
  vars:
    serving_root: "{{ lookup('env', 'HOME') }}/serving"
    shared_mirror: /shared/llm

  tasks:
    - name: etc/site.env exists (site values; git-ignored; copy etc/site.env.example)
      ansible.builtin.stat:
        path: "{{ serving_root }}/etc/site.env"
      register: site_env
      failed_when: not site_env.stat.exists

    - name: Private state directories
      ansible.builtin.file:
        path: "{{ serving_root }}/{{ item }}"
        state: directory
        mode: "0700"
      loop: [logs, state, webui-data]

    - name: Open WebUI environment for the login node (x86; idempotent)
      ansible.builtin.command:
        cmd: bash bin/install-webui-env.sh
        chdir: "{{ serving_root }}"
      register: webui_env
      changed_when: false

    - name: Agent runtime for the compute nodes (Node, Pi, ttyd; built on a compute node; idempotent)
      ansible.builtin.command:
        cmd: bash bin/install-agent-tools.sh
        chdir: "{{ serving_root }}"
      register: agent_tools
      changed_when: "'installed into' in agent_tools.stdout"

    - name: Engine nodes from site.env
      ansible.builtin.shell: ". etc/site.env && echo $ENGINE_NODES | tr ',' '\n'"
      args:
        chdir: "{{ serving_root }}"
      register: engine_nodes
      changed_when: false
      tags: [build]

    - name: Build the vLLM tree + checkpoints on each engine node (idempotent; first run downloads ~126 GB per node)
      ansible.builtin.command:
        cmd: tools/flash-next/bin/fn build
        chdir: "{{ serving_root }}"
      environment:
        FN_NODE: "{{ item }}"
      loop: "{{ engine_nodes.stdout_lines }}"
      register: fn_build
      changed_when: "'already' not in fn_build.stdout"
      tags: [build]

    - name: Verify each engine node (content checks)
      ansible.builtin.command:
        cmd: tools/flash-next/bin/fn verify
        chdir: "{{ serving_root }}"
      environment:
        FN_NODE: "{{ item }}"
      loop: "{{ engine_nodes.stdout_lines }}"
      changed_when: false
      tags: [build]

    - name: Retire the old stack's cron entries (single-node era)
      ansible.builtin.cron:
        name: "{{ item }}"
        state: absent
      loop: ["qwen38-serve supervise", "webui ensure"]

    - name: Tunnel key, supervise cron, login-node services (bin/serving install is idempotent)
      ansible.builtin.command:
        cmd: bin/serving install
        chdir: "{{ serving_root }}"
      changed_when: false

    - name: serving CLI on PATH
      ansible.builtin.file:
        src: "{{ serving_root }}/bin/serving"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/serving"
        state: link

    - name: Read-only user-facing mirror (kept fresh by supervise)
      ansible.builtin.file:
        path: "{{ shared_mirror }}/examples"
        state: directory
        mode: "0755"
